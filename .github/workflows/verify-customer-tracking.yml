name: Verify Customer Tracking

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-customer-tracking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check customer pages and shared booking data
        run: |
          BASE="https://booking.phuquocfishingtours.com"
          check_trip() {
            TOKEN="$1"; DATE="$2"; NAME="$3"; GUESTS="$4"
            PAGE_CODE=$(curl -sS --connect-timeout 10 --max-time 25 -o trip.html -w "%{http_code}" "$BASE/$TOKEN")
            echo "$TOKEN page=$PAGE_CODE"
            test "$PAGE_CODE" = "200"
            grep -q "Your Fishing Trip" trip.html

            API_CODE=$(curl -sS --connect-timeout 10 --max-time 25 -o trip.json -w "%{http_code}" "$BASE/api/public/trips/$TOKEN")
            echo "$TOKEN api=$API_CODE"
            test "$API_CODE" = "200"
            node -e 'const x=require("./trip.json"),d=process.argv[1],n=process.argv[2],g=process.argv[3]; console.log(JSON.stringify({date:x.service_date,name:x.representative,guests:x.guest_label,status:x.status,progress:x.progress})); if(x.service_date!==d||x.representative!==n||String(x.guest_label)!==g||x.status!=="confirmed")process.exit(1)' "$DATE" "$NAME" "$GUESTS"
          }

          check_trip k4n7m2q9x8v3r6p5 2026-10-04 Ken 2
          check_trip p5h8q2m7x4v9n6r3 2026-10-05 Phong 3
          check_trip j1k6m9q3x7v4n8r2 2027-01-14 Ken 2-4
          check_trip j6k2m8q4x9v3n7r5 2027-01-16 Ken 2-4
