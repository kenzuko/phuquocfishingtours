name: Fix Cano Thanh Nhan Name

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cano-thanh-nhan-name.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct partner identity in source
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("fishing-worker.js")
          text = path.read_text(encoding="utf-8")

          old_profile = 'thanhnhan: { actor: "Thạnh Nhân", role: "partner", company: "Cano Thạnh Nhân" }'
          new_profile = 'thanhnhan: { actor: "Thanh Nhàn", role: "partner", company: "Cano Thanh Nhàn" }'
          if old_profile not in text and new_profile not in text:
              raise SystemExit("partner profile marker not found")
          text = text.replace(old_profile, new_profile)

          old_session = '    if (!payload?.actor || Number(payload.exp || 0) < Date.now()) return null;\n    return payload;'
          new_session = '    if (!payload?.actor || Number(payload.exp || 0) < Date.now()) return null;\n    if (payload.actor === "Thạnh Nhân") payload.actor = "Thanh Nhàn";\n    if (payload.company === "Cano Thạnh Nhân") payload.company = "Cano Thanh Nhàn";\n    return payload;'
          if old_session in text:
              text = text.replace(old_session, new_session, 1)
          elif 'payload.actor === "Thạnh Nhân"' not in text:
              raise SystemExit("session normalization marker not found")

          path.write_text(text, encoding="utf-8")
          PY
          node --check fishing-worker.js
          grep -F 'actor: "Thanh Nhàn"' fishing-worker.js
          grep -F 'company: "Cano Thanh Nhàn"' fishing-worker.js

      - name: Commit correction
        run: |
          if git diff --quiet -- fishing-worker.js; then
            echo "Already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fishing-worker.js
          git commit -m "fix: correct Cano Thanh Nhàn partner identity"
          git push origin HEAD:main
