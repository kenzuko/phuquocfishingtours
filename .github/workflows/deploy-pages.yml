name: Deploy Fishing Desk to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-phuquocfishingtours-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: phuquocfishingtours-booking
  CUSTOM_DOMAIN: booking.phuquocfishingtours.com
  DB_NAME: phuquocfishingtours-booking

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --check booking-entry.js

      - name: Validate required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ADMIN_USER" || { echo "::error::Missing FISHING_DESK_ADMIN_USER"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::Missing FISHING_DESK_ADMIN_PASSWORD"; exit 1; }
          test -n "$SESSION_SECRET" || { echo "::error::Missing FISHING_DESK_SESSION_SECRET"; exit 1; }

      - name: Locate D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.143.0 d1 list --json > d1.json
          DB_ID=$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("d1.json","utf8")); const x=rows.find(r=>r.name===process.env.DB_NAME); if(x) process.stdout.write(x.uuid||x.id||"");')
          if [ -z "$DB_ID" ]; then
            echo "::error::D1 database $DB_NAME was not found."
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Fetch JoTrip visual assets from Google Drive
        run: |
          mkdir -p public/assets
          curl -fL --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=1aE5Ywq2taDkSDppjFFXPFNqDOqF47ond" -o public/assets/jotrip-logo.png
          curl -fL --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=1ArXduel7S_nmYoXyUDKiwo4bH70lI5bO" -o public/assets/boat-real.jpg
          curl -fL --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=1ZKk6C4v-ynKGGit7P1Kzie_Q85nujG-c" -o public/assets/island-real.jpg
          test -s public/assets/jotrip-logo.png
          test -s public/assets/boat-real.jpg
          test -s public/assets/island-real.jpg
          echo "Downloaded JoTrip logo + real Phu Quoc photos from owned Drive assets."

      - name: Build Pages Function and config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          npx --yes esbuild@0.25.10 booking-entry.js --bundle --format=esm --platform=neutral --target=es2022 --outfile=public/_worker.js
          node <<'NODE'
          const fs=require("fs");
          const cfg={
            "$schema":"node_modules/wrangler/config-schema.json",
            name:process.env.PAGES_PROJECT,
            pages_build_output_dir:"./public",
            compatibility_date:"2026-10-01",
            d1_databases:[{
              binding:"BOOKING_DB",
              database_name:process.env.DB_NAME,
              database_id:process.env.DB_ID,
              migrations_dir:"db/migrations"
            }]
          };
          fs.writeFileSync("wrangler.jsonc",JSON.stringify(cfg,null,2));
          NODE

      - name: Ensure Pages project exists
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          CODE=$(curl -sS -o project.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$PAGES_PROJECT")
          if [ "$CODE" = "404" ]; then
            node -e 'require("fs").writeFileSync("project-payload.json",JSON.stringify({name:process.env.PAGES_PROJECT,production_branch:"main"}))'
            CREATE_CODE=$(curl -sS -o project.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @project-payload.json "$API")
            if [ "$CREATE_CODE" != "200" ]; then
              cat project.json
              echo "::error::Unable to create Pages project (HTTP $CREATE_CODE). The API token must include Pages Write."
              exit 1
            fi
          elif [ "$CODE" != "200" ]; then
            cat project.json
            echo "::error::Unable to read Pages project (HTTP $CODE)."
            exit 1
          fi
          SUCCESS=$(node -e 'const x=require("./project.json"); process.stdout.write(String(x.success!==false))')
          test "$SUCCESS" = "true" || { cat project.json; exit 1; }
          SUBDOMAIN=$(node -e 'const x=require("./project.json"); const r=x.result||x; process.stdout.write(r.subdomain||"")')
          if [ -z "$SUBDOMAIN" ]; then SUBDOMAIN="$PAGES_PROJECT.pages.dev"; fi
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"
          echo "Pages target: $SUBDOMAIN"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 d1 migrations apply BOOKING_DB --remote

      - name: Configure Pages login secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          printf '%s' "$ADMIN_USER" | npx --yes wrangler@4.143.0 pages secret put ADMIN_USER --project-name "$PAGES_PROJECT"
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.143.0 pages secret put ADMIN_PASSWORD --project-name "$PAGES_PROJECT"
          printf '%s' "$SESSION_SECRET" | npx --yes wrangler@4.143.0 pages secret put SESSION_SECRET --project-name "$PAGES_PROJECT"

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.143.0 pages deploy public --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false

      - name: Verify production runtime
        env:
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
        run: |
          BASE="https://$PAGES_PROJECT.pages.dev"
          LOGIN_CODE=$(curl -sS -o login.html -w "%{http_code}" "$BASE/login")
          echo "pages_login_http=$LOGIN_CODE"
          test "$LOGIN_CODE" = "200" || { echo "::error::Pages login endpoint failed"; exit 1; }

          AUTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -c cookies.txt -b cookies.txt             -H "Origin: $BASE"             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "username=$ADMIN_USER"             --data-urlencode "password=$ADMIN_PASSWORD"             "$BASE/auth/login")
          echo "pages_auth_http=$AUTH_CODE"
          test "$AUTH_CODE" = "303" || { echo "::error::Pages login failed"; exit 1; }

          HEALTH_CODE=$(curl -sS -o health.json -w "%{http_code}" -b cookies.txt "$BASE/api/health")
          echo "pages_health_http=$HEALTH_CODE"
          cat health.json
          test "$HEALTH_CODE" = "200" || { echo "::error::Health endpoint failed"; exit 1; }
          node -e 'const x=require("./health.json"); if(x.status!=="ok" || x.database_bound!==true) process.exit(1)'

          ROOT_CODE=$(curl -sS -o app.html -w "%{http_code}" -b cookies.txt "$BASE/")
          echo "pages_app_http=$ROOT_CODE"
          test "$ROOT_CODE" = "200" || { echo "::error::App shell failed"; exit 1; }
          grep -q "Fishing Desk" app.html || { echo "::error::App shell content missing"; exit 1; }

          LOGO_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/assets/jotrip-logo.png")
          BOAT_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/assets/boat-real.jpg")
          ISLAND_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/assets/island-real.jpg")
          echo "visual_assets_http=$LOGO_CODE/$BOAT_CODE/$ISLAND_CODE"
          test "$LOGO_CODE" = "200" -a "$BOAT_CODE" = "200" -a "$ISLAND_CODE" = "200" || { echo "::error::Visual assets failed"; exit 1; }

          DASH_CODE=$(curl -sS -o dashboard.json -w "%{http_code}" -b cookies.txt "$BASE/api/v1/dashboard")
          echo "pages_dashboard_http=$DASH_CODE"
          test "$DASH_CODE" = "200" || { echo "::error::Dashboard query failed"; cat dashboard.json; exit 1; }
          node -e 'const x=require("./dashboard.json"); if(!Array.isArray(x.today_bookings)||!Array.isArray(x.tomorrow_bookings)||!Array.isArray(x.due_reminders)) process.exit(1)'

          SHORT_CODE=$(curl -sS -o short-trip.html -w "%{http_code}" "$BASE/k4n7m2q9x8v3r6p5")
          echo "short_trip_http=$SHORT_CODE"
          test "$SHORT_CODE" = "200" || { echo "::error::Short customer trip URL failed"; exit 1; }
          grep -q "Your Fishing Trip" short-trip.html || { echo "::error::Short customer trip page missing"; exit 1; }

          CUSTOM_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "https://$CUSTOM_DOMAIN/login" || true)
          echo "custom_domain_http=$CUSTOM_CODE"
          {
            echo "### Runtime verification"
            echo ""
            echo "- Pages login HTTP: $LOGIN_CODE"
            echo "- Pages auth HTTP: $AUTH_CODE"
            echo "- Pages health HTTP: $HEALTH_CODE"
            echo "- Pages app HTTP: $ROOT_CODE"
            echo "- Visual assets HTTP: $LOGO_CODE/$BOAT_CODE/$ISLAND_CODE"
            echo "- Pages dashboard HTTP: $DASH_CODE"
            echo "- Short customer trip HTTP: $SHORT_CODE"
            echo "- Custom domain HTTP: $CUSTOM_CODE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach external-DNS custom subdomain
        id: domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_TARGET: ${{ steps.pages.outputs.subdomain }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          CODE=$(curl -sS -o domain.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$CUSTOM_DOMAIN")
          if [ "$CODE" = "404" ]; then
            node -e 'require("fs").writeFileSync("domain-payload.json",JSON.stringify({name:process.env.CUSTOM_DOMAIN}))'
            CREATE_CODE=$(curl -sS -o domain.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @domain-payload.json "$API")
            if [ "$CREATE_CODE" != "200" ]; then
              cat domain.json
              echo "::error::Unable to attach Pages custom domain (HTTP $CREATE_CODE)."
              exit 1
            fi
          elif [ "$CODE" != "200" ]; then
            cat domain.json
            echo "::error::Unable to read Pages custom domain (HTTP $CODE)."
            exit 1
          fi
          STATUS=$(node -e 'const x=require("./domain.json"); const r=x.result||x; process.stdout.write(r.status||"unknown")')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "### Fishing Desk Pages"
            echo ""
            echo "- Pages: https://$PAGES_TARGET"
            echo "- Custom domain: https://$CUSTOM_DOMAIN"
            echo "- Domain status: $STATUS"
            echo "- DNS: CNAME booking -> $PAGES_TARGET"
          } >> "$GITHUB_STEP_SUMMARY"
