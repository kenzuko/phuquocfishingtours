name: Fix Fishing Parser Prefill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-fishing-parser-prefill.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch parser, existing-booking enrichment and UI
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          worker_path = Path('fishing-worker.js')
          worker = worker_path.read_text(encoding='utf-8')

          block_pattern = re.compile(r'function parseQuickBooking\(input\) \{.*?\n\}\n\nasync function findDuplicate\(db, data\) \{.*?\n\}\n', re.S)
          new_block = r'''function parseQuickBooking(input) {
  const text = String(input || "").replace(/\r/g, "").trim();
  const base = parseBookingText(text);
  const normalized = text.replace(/[–—]/g, "-");
  const dateMatch = normalized.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\b/);
  const dayOnlyMatch = normalized.match(/\bngày\s*(\d{1,2})\b/i);
  const dayHint = dateMatch ? Number(dateMatch[1]) : Number(dayOnlyMatch?.[1] || 0) || null;
  const serviceDate = base.service_date || (dateMatch ? `${dateMatch[3]}-${String(dateMatch[2]).padStart(2,"0")}-${String(dateMatch[1]).padStart(2,"0")}` : "");
  const session = /\b(chiều|afternoon|pm)\b/i.test(normalized) ? "afternoon" : /\b(sáng|morning|am)\b/i.test(normalized) ? "morning" : "";
  const guests = base.guests || Number(normalized.match(/\b(\d{1,2})\s*(?:NL|khách|khach|pax|người|nguoi)\b/i)?.[1] || 0) || null;
  let representative = base.representative;
  if (!representative && dateMatch) {
    const afterDate = normalized.slice((dateMatch.index || 0) + dateMatch[0].length);
    const m = afterDate.match(/(?:sáng|chiều|morning|afternoon|am|pm)?\s*-\s*([^/(\n-]{2,50})/i);
    if (m) representative = m[1].trim();
  }
  if (!representative) {
    const m = normalized.match(/\b(?:của|khách(?:\s+tên)?|guest)\s+([A-Za-zÀ-ỹ][A-Za-zÀ-ỹ' .-]{1,40})(?=$|[\n,;])/i);
    if (m) representative = m[1].trim();
  }
  let nationality = base.nationality;
  if (!nationality) {
    if (/\b(Nga|Russia|Russian)\b/i.test(normalized)) nationality = "Russia";
    else if (/\b(Hàn|Korea|Korean)\b/i.test(normalized)) nationality = "Korea";
    else if (/\b(Trung Quốc|China|Chinese)\b/i.test(normalized)) nationality = "China";
    else if (/\b(Taiwan|Đài Loan)\b/i.test(normalized)) nationality = "Taiwan";
    else if (/\b(Việt Nam|Vietnam|Vietnamese)\b/i.test(normalized)) nationality = "Vietnam";
  }
  const pickup = normalized.match(/(?:đón|don|pickup|pick-up)\s*(?:lúc|at|:)?\s*(\d{1,2}:\d{2})?\s*(?:tại|at)?\s*([^\n;]+)?/i);
  const phone = base.phone || base.whatsapp || normalizePhone(normalized);
  return {
    ...base,
    service_date: serviceDate,
    day_hint: dayHint,
    tour_type: base.tour_type || "Big Fishing",
    guests,
    representative: representative || "",
    phone,
    nationality: nationality || "",
    start_time: base.start_time || (session === "morning" ? "05:00" : session === "afternoon" ? "14:00" : ""),
    end_time: base.end_time || (session === "morning" ? "14:00" : session === "afternoon" ? "21:00" : ""),
    pickup_time: base.pickup_time || pickup?.[1] || "",
    pickup_location: base.pickup_location || String(pickup?.[2] || "").trim(),
    session,
    source_text: text
  };
}

async function bookingDetailForPortal(db, bookingId) {
  return await queryOne(db, `SELECT b.*,
    COALESCE(
      (SELECT c.name FROM assignments a JOIN contacts c ON c.id=a.contact_id WHERE a.booking_id=b.id AND a.role='cash_collector' AND a.status!='cancelled' ORDER BY a.created_at DESC LIMIT 1),
      (SELECT c.name FROM contacts c WHERE c.id=b.cash_collector_contact_id LIMIT 1)
    ) AS cash_collector_name
    FROM bookings b WHERE b.id=? LIMIT 1`, [bookingId]);
}

function mergeExistingBooking(parsed, existing) {
  if (!existing) return parsed;
  const out = { ...parsed };
  const fill = ["service_date","tour_type","representative","guests","nationality","phone","start_time","end_time","pickup_time","pickup_location","notes"];
  for (const key of fill) {
    if (out[key] === "" || out[key] === null || out[key] === undefined || (key === "guests" && !out[key])) out[key] = existing[key] ?? out[key];
  }
  if (out.total_amount === null || out.total_amount === undefined) out.total_amount = existing.total_amount ?? null;
  if (!parsed.total_amount && existing.currency) out.currency = existing.currency;
  if (!out.payment_method || out.payment_method === "unknown") out.payment_method = existing.payment_method || "unknown";
  out.payment_status = existing.payment_status || "due";
  out.cash_collector_name = existing.cash_collector_name || "";
  out.matched_existing = true;
  return out;
}

async function findDuplicate(db, data) {
  let row = null;
  if (data.service_date && data.phone) {
    row = await queryOne(db, `SELECT id FROM bookings WHERE service_date=? AND status!='cancelled' AND phone=? ORDER BY updated_at DESC LIMIT 1`, [data.service_date, data.phone]);
  }
  if (!row && data.service_date && data.representative) {
    row = await queryOne(db, `SELECT id FROM bookings WHERE service_date=? AND status!='cancelled' AND lower(representative)=lower(?) ORDER BY updated_at DESC LIMIT 1`, [data.service_date, data.representative]);
  }
  if (!row && data.service_date && data.guests) {
    const rows = await queryAll(db, `SELECT id FROM bookings WHERE service_date=? AND status!='cancelled' AND guests=? ORDER BY updated_at DESC LIMIT 2`, [data.service_date, data.guests]);
    if (rows.length === 1) row = rows[0];
  }
  if (!row && data.day_hint) {
    const candidates = await queryAll(db, `SELECT id,service_date,representative,guests,start_time FROM bookings WHERE service_date>=? AND status!='cancelled' AND substr(service_date,9,2)=? ORDER BY service_date ASC,updated_at DESC LIMIT 60`, [localDate(-1), String(data.day_hint).padStart(2,"0")]);
    const rep = String(data.representative || "").trim().toLowerCase();
    let best = null, bestScore = -1;
    for (const candidate of candidates) {
      let score = 0;
      const candidateRep = String(candidate.representative || "").trim().toLowerCase();
      if (rep && candidateRep === rep) score += 8;
      else if (rep && candidateRep && (candidateRep.includes(rep) || rep.includes(candidateRep))) score += 4;
      if (data.guests && Number(candidate.guests) === Number(data.guests)) score += 5;
      if (data.start_time && candidate.start_time === data.start_time) score += 2;
      if (score > bestScore) { best = candidate; bestScore = score; }
    }
    if (best && bestScore >= 8) row = best;
  }
  return row ? await bookingDetailForPortal(db, row.id) : null;
}
'''
          worker, count = block_pattern.subn(new_block, worker, count=1)
          if count != 1:
            raise SystemExit('Could not replace parse/findDuplicate block')

          old_parse = '''    const result = parseQuickBooking(body.text);\n    const duplicate = await findDuplicate(db, result);\n    return json({ result, duplicate });'''
          new_parse = '''    const parsed = parseQuickBooking(body.text);\n    const duplicate = await findDuplicate(db, parsed);\n    const result = mergeExistingBooking(parsed, duplicate);\n    return json({ result, duplicate });'''
          if old_parse not in worker:
            raise SystemExit('Parse endpoint marker missing')
          worker = worker.replace(old_parse, new_parse, 1)

          worker = worker.replace(
            'pickup_location:String(body.pickup_location||"").trim()||null,\n      notes:String(body.notes||"").trim()||null,',
            'pickup_location:String(body.pickup_location||"").trim()||null,\n      total_amount:Number(body.total_amount||0)||null,\n      currency:String(body.currency||"VND").trim()||"VND",\n      notes:String(body.notes||"").trim()||null,',
            1
          )

          old_update = "UPDATE bookings SET service_date=?,tour_type=?,guests=?,representative=?,phone=?,nationality=?,start_time=?,end_time=?,pickup_time=?,pickup_location=?,notes=?,source_text=?,status=CASE WHEN status IN ('inquiry','hold') THEN 'confirmed' ELSE status END,updated_at=CURRENT_TIMESTAMP WHERE id=?"
          new_update = "UPDATE bookings SET service_date=?,tour_type=?,guests=?,representative=?,phone=?,nationality=?,start_time=?,end_time=?,pickup_time=?,pickup_location=?,total_amount=?,currency=?,notes=?,source_text=?,status=CASE WHEN status IN ('inquiry','hold') THEN 'confirmed' ELSE status END,updated_at=CURRENT_TIMESTAMP WHERE id=?"
          if old_update not in worker:
            raise SystemExit('Update SQL marker missing')
          worker = worker.replace(old_update, new_update, 1)
          old_bind = 'values.pickup_time,values.pickup_location,values.notes,values.source_text,bookingId)'
          new_bind = 'values.pickup_time,values.pickup_location,values.total_amount,values.currency,values.notes,values.source_text,bookingId)'
          if old_bind not in worker:
            raise SystemExit('Update bind marker missing')
          worker = worker.replace(old_bind, new_bind, 1)

          old_insert = "INSERT INTO bookings(id,booking_code,status,service_date,tour_type,guests,representative,phone,nationality,start_time,end_time,pickup_time,pickup_location,notes,source_text,owner_name) VALUES(?,?,'confirmed',?,?,?,?,?,?,?,?,?,?,?,?,?)"
          new_insert = "INSERT INTO bookings(id,booking_code,status,service_date,tour_type,guests,representative,phone,nationality,start_time,end_time,pickup_time,pickup_location,total_amount,currency,notes,source_text,owner_name) VALUES(?,?,'confirmed',?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)"
          if old_insert not in worker:
            raise SystemExit('Insert SQL marker missing')
          worker = worker.replace(old_insert, new_insert, 1)
          old_insert_bind = 'values.pickup_time,values.pickup_location,values.notes,values.source_text,actor)'
          new_insert_bind = 'values.pickup_time,values.pickup_location,values.total_amount,values.currency,values.notes,values.source_text,actor)'
          if old_insert_bind not in worker:
            raise SystemExit('Insert bind marker missing')
          worker = worker.replace(old_insert_bind, new_insert_bind, 1)

          worker = worker.replace(
            'b.pickup_time,b.pickup_location,b.weather_status,b.owner_name,b.updated_at,',
            'b.pickup_time,b.pickup_location,b.total_amount,b.currency,b.payment_status,b.weather_status,b.owner_name,b.updated_at,',
            1
          )
          return_marker = "AS return_driver_name\n  FROM bookings b"
          return_repl = "AS return_driver_name,\n  COALESCE((SELECT c.name FROM assignments a JOIN contacts c ON c.id=a.contact_id WHERE a.booking_id=b.id AND a.role='cash_collector' AND a.status!='cancelled' ORDER BY a.created_at DESC LIMIT 1),(SELECT c.name FROM contacts c WHERE c.id=b.cash_collector_contact_id LIMIT 1)) AS cash_collector_name\n  FROM bookings b"
          if return_marker not in worker:
            raise SystemExit('Schedule collector marker missing')
          worker = worker.replace(return_marker, return_repl, 1)

          worker_path.write_text(worker, encoding='utf-8')

          app_path = Path('fishing-public/fishing/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_fields = 'const fieldIds=["service_date","tour_type","representative","guests","nationality","phone","start_time","end_time","pickup_time","pickup_location","notes"];'
          new_fields = 'const fieldIds=["service_date","tour_type","representative","guests","nationality","phone","start_time","end_time","pickup_time","pickup_location","total_amount","currency","cash_collector_name","payment_status","notes"];'
          if old_fields not in app:
            raise SystemExit('fieldIds marker missing')
          app = app.replace(old_fields, new_fields, 1)

          old_card_piece = 'const returnDriver=row.return_driver_name?esc(row.return_driver_name):"Theo tài xế đi / cập nhật sau";const isReady=ready(row);'
          new_card_piece = 'const returnDriver=row.return_driver_name?esc(row.return_driver_name):"Theo tài xế đi / cập nhật sau";const collectAmount=row.total_amount?`${Number(row.total_amount).toLocaleString("vi-VN")} ${esc(row.currency||"VND")}`:"Chưa có giá thu";const collector=row.cash_collector_name?esc(row.cash_collector_name):"Chưa chỉ định";const isReady=ready(row);'
          if old_card_piece not in app:
            raise SystemExit('tripCard marker missing')
          app = app.replace(old_card_piece, new_card_piece, 1)
          old_ops = '<div class="ops-line"><span>Đón khách</span><span>${pickup}</span></div><div class="ops-line"><span>Tài xế đi</span><span>${driver}</span></div>'
          new_ops = '<div class="ops-line"><span>Đón khách</span><span>${pickup}</span></div><div class="ops-line"><span>Thu tiền</span><span>${collectAmount} · ${collector}</span></div><div class="ops-line"><span>Tài xế đi</span><span>${driver}</span></div>'
          if old_ops not in app:
            raise SystemExit('ops line marker missing')
          app = app.replace(old_ops, new_ops, 1)
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('fishing-public/fishing/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_pickup = '<label>Điểm đón<input id="pickup_location" placeholder="Khách sạn / địa điểm"></label>\n            <label class="wide">Ghi chú<textarea id="notes" rows="3" placeholder="Yêu cầu đặc biệt nếu có"></textarea></label>'
          new_pickup = '<label>Khách sạn / điểm đón<input id="pickup_location" placeholder="Khách sạn / địa điểm"></label>\n            <label>Tiền cần thu<input id="total_amount" type="number" min="0" step="1000" inputmode="numeric" placeholder="0"></label>\n            <label>Tiền tệ<input id="currency" value="VND" placeholder="VND"></label>\n            <label>Người thu<input id="cash_collector_name" readonly placeholder="Chưa chỉ định"></label>\n            <label>Trạng thái thu<input id="payment_status" readonly placeholder="Chưa thu"></label>\n            <label class="wide">Ghi chú<textarea id="notes" rows="3" placeholder="Yêu cầu đặc biệt nếu có"></textarea></label>'
          if old_pickup not in index:
            raise SystemExit('preview form marker missing')
          index = index.replace(old_pickup, new_pickup, 1)
          index_path.write_text(index, encoding='utf-8')
          PY

          node --check fishing-worker.js
          node --check fishing-public/fishing/app.js
          npm install --no-audit --no-fund
          npm run build

      - name: Commit parser/data fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fishing-worker.js fishing-public/fishing/app.js fishing-public/fishing/index.html
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix: enrich partner messages from existing booking data"
          git push origin HEAD:main
