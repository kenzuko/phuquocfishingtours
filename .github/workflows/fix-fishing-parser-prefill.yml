name: Fix Fishing Parser Prefill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-fishing-parser-prefill.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch parser and portal UI
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py
          node --check fishing-worker.js
          node --check fishing-public/fishing/app.js
          npm install --no-audit --no-fund
          npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fishing-worker.js fishing-public/fishing/app.js fishing-public/fishing/index.html
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix: enrich fishing booking from existing data"
          git push origin HEAD:main
