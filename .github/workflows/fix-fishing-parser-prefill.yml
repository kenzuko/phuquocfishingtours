name: Fix Fishing Parser Prefill

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_fishing_parser_prefill.py"
      - ".fishing-parser-trigger"
      - ".github/workflows/fix-fishing-parser-prefill.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply parser and data prefill patch
        run: |
          python -m py_compile scripts/patch_fishing_parser_prefill.py
          python scripts/patch_fishing_parser_prefill.py
          node --check fishing-worker.js
          node --check fishing-public/fishing/app.js
          npm install --no-audit --no-fund
          npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fishing-worker.js fishing-public/fishing/app.js fishing-public/fishing/index.html
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix: resolve partner message from existing booking data"
          git push origin HEAD:main
