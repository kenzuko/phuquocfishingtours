name: Apply Customer Tracking Calendar Patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_customer_tracking_calendar.py"
      - ".customer-tracking-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply calendar and customer tracking patch
        run: |
          python -m py_compile scripts/patch_customer_tracking_calendar.py
          python scripts/patch_customer_tracking_calendar.py
          node --check worker.js
          node --check public/app.js
          node --check public/trip.js
          node --check fishing-worker.js
          node --check fishing-public/fishing/app.js
          npm install --no-audit --no-fund
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js public/app.js public/trip.js public/trip.html public/trip.css fishing-worker.js fishing-public/fishing/app.js db/migrations/0004-calendar-customer-tracking.sql
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "feat: add tour calendar and customer tracking links"
          git push origin HEAD:main
