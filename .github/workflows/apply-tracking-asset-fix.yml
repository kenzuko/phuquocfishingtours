name: Apply Tracking Asset Fix

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix_customer_tracking_asset.py"
      - ".tracking-asset-fix-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch clean customer trip asset path
        run: |
          python -m py_compile scripts/fix_customer_tracking_asset.py
          python scripts/fix_customer_tracking_asset.py
          node --check worker.js
      - name: Commit worker fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix: serve customer tracking page without asset redirect"
          git push origin HEAD:main
