name: Legacy Worker Preview

on:
  workflow_dispatch:

concurrency:
  group: deploy-phuquocfishingtours-worker-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Locate D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: phuquocfishingtours-booking
        run: |
          npx --yes wrangler@4.143.0 d1 list --json > d1.json
          DB_ID=$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("d1.json","utf8")); const x=rows.find(r=>r.name===process.env.DB_NAME); if(x) process.stdout.write(x.uuid||x.id||"");')
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Build preview config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs=require("fs");
          const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          cfg.d1_databases=[{
            binding:"BOOKING_DB",
            database_name:"phuquocfishingtours-booking",
            database_id:process.env.DB_ID,
            migrations_dir:"db/migrations"
          }];
          delete cfg.routes;
          fs.writeFileSync("wrangler.preview.json",JSON.stringify(cfg,null,2));
          NODE
      - name: Deploy workers.dev preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 deploy --config wrangler.preview.json
