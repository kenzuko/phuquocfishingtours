name: Deploy Fishing Desk to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-phuquocfishingtours-desk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify
        run: npm run build

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository."
          fi

      - name: Locate or create D1 database
        if: steps.cf.outputs.ready == 'true'
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: phuquocfishingtours-booking
        run: |
          npx --yes wrangler@4.143.0 d1 list --json > d1.json
          DB_ID=$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("d1.json","utf8")); const x=rows.find(r=>r.name===process.env.DB_NAME); if(x) process.stdout.write(x.uuid||x.id||"");')
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@4.143.0 d1 create "$DB_NAME" --location apac
            npx --yes wrangler@4.143.0 d1 list --json > d1.json
            DB_ID=$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("d1.json","utf8")); const x=rows.find(r=>r.name===process.env.DB_NAME); if(x) process.stdout.write(x.uuid||x.id||"");')
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Unable to resolve D1 database ID."
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build production Wrangler config
        if: steps.cf.outputs.ready == 'true'
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cfg = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          cfg.d1_databases = [{
            binding: "BOOKING_DB",
            database_name: "phuquocfishingtours-booking",
            database_id: process.env.DB_ID,
            migrations_dir: "db/migrations"
          }];
          fs.writeFileSync("wrangler.deploy.json", JSON.stringify(cfg, null, 2));
          NODE

      - name: Apply D1 migrations
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 d1 migrations apply BOOKING_DB --remote --config wrangler.deploy.json

      - name: Deploy Worker and custom domain
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 deploy --config wrangler.deploy.json

      - name: Configure Fishing Desk login
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          if [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASSWORD" ] || [ -z "$SESSION_SECRET" ]; then
            echo "::warning::Worker deployed fail-closed. Add FISHING_DESK_ADMIN_USER, FISHING_DESK_ADMIN_PASSWORD, FISHING_DESK_SESSION_SECRET to enable login."
            exit 0
          fi
          printf '%s' "$ADMIN_USER" | npx --yes wrangler@4.143.0 secret put ADMIN_USER --name phuquocfishingtours-desk
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.143.0 secret put ADMIN_PASSWORD --name phuquocfishingtours-desk
          printf '%s' "$SESSION_SECRET" | npx --yes wrangler@4.143.0 secret put SESSION_SECRET --name phuquocfishingtours-desk
