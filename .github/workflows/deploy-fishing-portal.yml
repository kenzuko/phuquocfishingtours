name: Deploy Fishing Ops Portal

on:
  push:
    branches: [main]
    paths:
      - "fishing-entry.js"
      - "fishing-worker.js"
      - "fishing-public/**"
      - "core/parser.js"
      - "db/migrations/**"
      - ".github/workflows/deploy-fishing-portal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-jotrip-fishing-ops
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: jotrip-fishing-ops
  CUSTOM_DOMAIN: fishing.jotrip.vn
  ROOT_DOMAIN: jotrip.vn
  DB_NAME: phuquocfishingtours-booking

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --check fishing-entry.js
          node --check fishing-worker.js
          node --check fishing-public/fishing/app.js
          test -s fishing-public/fishing/jotrip-logo.png

      - name: Validate required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ADMIN_USER" || { echo "::error::Missing FISHING_DESK_ADMIN_USER"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::Missing FISHING_DESK_ADMIN_PASSWORD"; exit 1; }
          test -n "$SESSION_SECRET" || { echo "::error::Missing FISHING_DESK_SESSION_SECRET"; exit 1; }

      - name: Locate D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.143.0 d1 list --json > d1.json
          DB_ID=$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("d1.json","utf8")); const x=rows.find(r=>r.name===process.env.DB_NAME); if(x) process.stdout.write(x.uuid||x.id||"");')
          test -n "$DB_ID" || { echo "::error::D1 database not found"; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build Pages Function and config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          npx --yes esbuild@0.25.10 fishing-entry.js --bundle --format=esm --platform=neutral --target=es2022 --outfile=fishing-public/_worker.js
          cp wrangler.jsonc wrangler.worker.backup.jsonc
          node <<'NODE'
          const fs=require("fs");
          const cfg={
            "$schema":"node_modules/wrangler/config-schema.json",
            name:process.env.PAGES_PROJECT,
            pages_build_output_dir:"./fishing-public",
            compatibility_date:"2026-10-01",
            d1_databases:[{
              binding:"BOOKING_DB",
              database_name:process.env.DB_NAME,
              database_id:process.env.DB_ID,
              migrations_dir:"db/migrations"
            }]
          };
          fs.writeFileSync("wrangler.jsonc",JSON.stringify(cfg,null,2));
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 d1 migrations apply BOOKING_DB --remote

      - name: Ensure Pages project exists
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          CODE=$(curl -sS -o project.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$PAGES_PROJECT")
          if [ "$CODE" = "404" ]; then
            node -e 'require("fs").writeFileSync("project-payload.json",JSON.stringify({name:process.env.PAGES_PROJECT,production_branch:"main"}))'
            CREATE_CODE=$(curl -sS -o project.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @project-payload.json "$API")
            test "$CREATE_CODE" = "200" || { cat project.json; echo "::error::Unable to create Pages project"; exit 1; }
          elif [ "$CODE" != "200" ]; then
            cat project.json
            echo "::error::Unable to read Pages project (HTTP $CODE)"
            exit 1
          fi
          SUBDOMAIN=$(node -e 'const x=require("./project.json"); const r=x.result||x; process.stdout.write(r.subdomain||"")')
          if [ -z "$SUBDOMAIN" ]; then SUBDOMAIN="$PAGES_PROJECT.pages.dev"; fi
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Configure Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          printf '%s' "$ADMIN_USER" | npx --yes wrangler@4.143.0 pages secret put ADMIN_USER --project-name "$PAGES_PROJECT"
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.143.0 pages secret put ADMIN_PASSWORD --project-name "$PAGES_PROJECT"
          printf '%s' "$SESSION_SECRET" | npx --yes wrangler@4.143.0 pages secret put SESSION_SECRET --project-name "$PAGES_PROJECT"

      - name: Deploy Pages with D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 pages deploy fishing-public --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Attach custom domain
        id: domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_TARGET: ${{ steps.pages.outputs.subdomain }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          CODE=$(curl -sS -o domain.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$CUSTOM_DOMAIN")
          if [ "$CODE" = "404" ]; then
            node -e 'require("fs").writeFileSync("domain-payload.json",JSON.stringify({name:process.env.CUSTOM_DOMAIN}))'
            CREATE_CODE=$(curl -sS -o domain.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @domain-payload.json "$API")
            test "$CREATE_CODE" = "200" || { cat domain.json; echo "::error::Unable to attach custom domain"; exit 1; }
          elif [ "$CODE" != "200" ]; then
            cat domain.json
            echo "::error::Unable to read custom domain (HTTP $CODE)"
            exit 1
          fi

      - name: Create or repair fishing DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_TARGET: ${{ steps.pages.outputs.subdomain }}
        run: |
          ZONES_API="https://api.cloudflare.com/client/v4/zones"
          curl -sS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=$ROOT_DOMAIN" \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            "$ZONES_API" > zone.json
          ZONE_ID=$(node -e 'const x=require("./zone.json"); const z=(x.result||[]).find(v=>v.name===process.env.ROOT_DOMAIN); if(z) process.stdout.write(z.id||"")')
          test -n "$ZONE_ID" || { cat zone.json; echo "::error::Cloudflare zone $ROOT_DOMAIN not found in this account"; exit 1; }

          DNS_API="$ZONES_API/$ZONE_ID/dns_records"
          curl -sS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "type=CNAME" \
            --data-urlencode "name=$CUSTOM_DOMAIN" \
            "$DNS_API" > dns.json
          REC_ID=$(node -e 'const x=require("./dns.json"); const r=(x.result||[])[0]; if(r) process.stdout.write(r.id||"")')
          node -e 'require("fs").writeFileSync("dns-payload.json",JSON.stringify({type:"CNAME",name:process.env.CUSTOM_DOMAIN,content:process.env.PAGES_TARGET,ttl:1,proxied:true}))'
          if [ -n "$REC_ID" ]; then
            CODE=$(curl -sS -o dns-result.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @dns-payload.json "$DNS_API/$REC_ID")
          else
            CODE=$(curl -sS -o dns-result.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @dns-payload.json "$DNS_API")
          fi
          test "$CODE" = "200" || { cat dns-result.json; echo "::error::Unable to create/update $CUSTOM_DOMAIN DNS"; exit 1; }
          node -e 'const x=require("./dns-result.json"); if(x.success!==true || x.result.proxied!==true) process.exit(1); console.log(`DNS ready: ${x.result.name} -> ${x.result.content}, proxied=${x.result.proxied}`)'

      - name: Verify root-native runtime and browser assets
        env:
          PAGES_TARGET: ${{ steps.pages.outputs.subdomain }}
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'

          PAGE_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o pages.html -w "%{http_code}" -A "$UA" "https://$PAGES_TARGET/" || true)
          echo "pages_root=$PAGE_CODE"
          test "$PAGE_CODE" = "200" || { head -c 800 pages.html || true; exit 1; }
          grep -Eq "Fishing Ops|Lịch điều hành" pages.html || { head -c 800 pages.html; exit 1; }

          for i in 1 2 3 4 5 6; do
            ROOT_RESULT=$(curl -sS -L --max-redirs 5 --connect-timeout 10 --max-time 25 -o root.html -w 'code=%{http_code} redirects=%{num_redirects} effective=%{url_effective}' -A "$UA" "https://$CUSTOM_DOMAIN/" || true)
            OLD_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" -A "$UA" "https://$CUSTOM_DOMAIN/fishing" || true)
            echo "root=$ROOT_RESULT old_fishing=$OLD_CODE attempt=$i"
            if echo "$ROOT_RESULT" | grep -q 'code=200' && echo "$ROOT_RESULT" | grep -q 'redirects=0'; then break; fi
            sleep 5
          done
          echo "$ROOT_RESULT" | grep -q 'code=200' || exit 1
          echo "$ROOT_RESULT" | grep -q 'redirects=0' || exit 1
          grep -Eq "Fishing Ops|Lịch điều hành" root.html || { head -c 800 root.html; exit 1; }
          test "$OLD_CODE" = "200" || { echo "::error::Legacy /fishing must be direct 200, got $OLD_CODE"; exit 1; }

          APP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o served-app.js -w "%{http_code}" -A "$UA" "https://$CUSTOM_DOMAIN/app.js?v=20261003d" || true)
          echo "served_app_http=$APP_CODE"
          test "$APP_CODE" = "200" || { head -c 800 served-app.js || true; exit 1; }
          if grep -Fq 'window.location.href="/fishing"' served-app.js; then
            echo "::error::Served app.js still contains the old /fishing client redirect"
            exit 1
          fi
          if grep -Fq '/fishing/api' served-app.js; then
            echo "::error::Served app.js still contains legacy /fishing/api paths"
            exit 1
          fi
          grep -Fq '/api/me' served-app.js || { echo "::error::Served app.js is not root-native"; exit 1; }

          {
            echo "### Fishing Ops Portal"
            echo ""
            echo "- Custom domain: https://$CUSTOM_DOMAIN"
            echo "- Root: direct HTTP 200, zero redirects"
            echo "- Legacy /fishing: direct HTTP 200"
            echo "- Browser app.js: root-native, no /fishing redirect"
            echo "- DNS: proxied CNAME -> $PAGES_TARGET"
            echo "- Data: shared D1 $DB_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
