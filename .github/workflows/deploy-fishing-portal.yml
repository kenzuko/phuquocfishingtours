name: Deploy Fishing Ops Portal

on:
  push:
    branches: [main]
    paths:
      - "fishing-entry.js"
      - "fishing-worker.js"
      - "fishing-public/**"
      - "core/parser.js"
      - "db/migrations/**"
      - ".github/workflows/deploy-fishing-portal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-jotrip-fishing-ops
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: jotrip-fishing-ops
  CUSTOM_DOMAIN: fishing.jotrip.vn
  ROOT_DOMAIN: jotrip.vn
  DB_NAME: phuquocfishingtours-booking

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify source
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --check fishing-entry.js
          node --check fishing-worker.js
          node --check fishing-public/fishing/app.js
          test -s fishing-public/fishing/jotrip-logo.png

      - name: Validate required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$ADMIN_USER"
          test -n "$ADMIN_PASSWORD"
          test -n "$SESSION_SECRET"

      - name: Locate D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.143.0 d1 list --json > d1.json
          DB_ID=$(node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync("d1.json","utf8"));const x=rows.find(r=>r.name===process.env.DB_NAME);if(x)process.stdout.write(x.uuid||x.id||"")')
          test -n "$DB_ID" || { echo "::error::D1 database not found"; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build Pages worker
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          npx --yes esbuild@0.25.10 fishing-entry.js --bundle --format=esm --platform=neutral --target=es2022 --outfile=fishing-public/_worker.js
          node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.jsonc',JSON.stringify({
            "$schema":"node_modules/wrangler/config-schema.json",
            name:process.env.PAGES_PROJECT,
            pages_build_output_dir:"./fishing-public",
            compatibility_date:"2026-10-01",
            d1_databases:[{binding:"BOOKING_DB",database_name:process.env.DB_NAME,database_id:process.env.DB_ID,migrations_dir:"db/migrations"}]
          },null,2));
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 d1 migrations apply BOOKING_DB --remote

      - name: Ensure Pages project exists
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          CODE=$(curl -sS -o project.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$PAGES_PROJECT")
          if [ "$CODE" = "404" ]; then
            printf '{"name":"%s","production_branch":"main"}' "$PAGES_PROJECT" > project-payload.json
            CODE=$(curl -sS -o project.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @project-payload.json "$API")
          fi
          test "$CODE" = "200" || { cat project.json; exit 1; }
          SUBDOMAIN=$(node -e 'const x=require("./project.json");const r=x.result||x;process.stdout.write(r.subdomain||process.env.PAGES_PROJECT+".pages.dev")')
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Configure Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          printf '%s' "$ADMIN_USER" | npx --yes wrangler@4.143.0 pages secret put ADMIN_USER --project-name "$PAGES_PROJECT"
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.143.0 pages secret put ADMIN_PASSWORD --project-name "$PAGES_PROJECT"
          printf '%s' "$SESSION_SECRET" | npx --yes wrangler@4.143.0 pages secret put SESSION_SECRET --project-name "$PAGES_PROJECT"

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 pages deploy fishing-public --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Attach custom domain and DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_TARGET: ${{ steps.pages.outputs.subdomain }}
        run: |
          DOM_API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          CODE=$(curl -sS -o domain.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$DOM_API/$CUSTOM_DOMAIN")
          if [ "$CODE" = "404" ]; then
            printf '{"name":"%s"}' "$CUSTOM_DOMAIN" > domain-payload.json
            CODE=$(curl -sS -o domain.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @domain-payload.json "$DOM_API")
          fi
          test "$CODE" = "200" || { cat domain.json; exit 1; }

          ZONES_API="https://api.cloudflare.com/client/v4/zones"
          curl -sS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=$ROOT_DOMAIN" --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" "$ZONES_API" > zone.json
          ZONE_ID=$(node -e 'const x=require("./zone.json");const z=(x.result||[]).find(v=>v.name===process.env.ROOT_DOMAIN);if(z)process.stdout.write(z.id||"")')
          test -n "$ZONE_ID" || { cat zone.json; exit 1; }
          DNS_API="$ZONES_API/$ZONE_ID/dns_records"
          curl -sS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "type=CNAME" --data-urlencode "name=$CUSTOM_DOMAIN" "$DNS_API" > dns.json
          REC_ID=$(node -e 'const x=require("./dns.json");const r=(x.result||[])[0];if(r)process.stdout.write(r.id||"")')
          node -e 'require("fs").writeFileSync("dns-payload.json",JSON.stringify({type:"CNAME",name:process.env.CUSTOM_DOMAIN,content:process.env.PAGES_TARGET,ttl:1,proxied:true}))'
          if [ -n "$REC_ID" ]; then METHOD=PUT; URL="$DNS_API/$REC_ID"; else METHOD=POST; URL="$DNS_API"; fi
          CODE=$(curl -sS -o dns-result.json -w "%{http_code}" -X "$METHOD" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @dns-payload.json "$URL")
          test "$CODE" = "200" || { cat dns-result.json; exit 1; }

      - name: Verify zero-redirect browser flow
        env:
          PAGES_TARGET: ${{ steps.pages.outputs.subdomain }}
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          BASE="https://$CUSTOM_DOMAIN"

          for PATHNAME in / /app /fishing; do
            RESULT=$(curl -sS --connect-timeout 10 --max-time 20 -o page.html -w 'code=%{http_code} redirects=%{num_redirects}' -A "$UA" "$BASE$PATHNAME" || true)
            echo "$PATHNAME -> $RESULT"
            echo "$RESULT" | grep -q 'code=200' || exit 1
            echo "$RESULT" | grep -q 'redirects=0' || exit 1
            grep -Eq 'Fishing Ops|Lịch điều hành' page.html || exit 1
          done

          rm -f cookies.txt
          LOGIN_RESULT=$(curl -sS --connect-timeout 10 --max-time 20 -o logged-in.html -w 'code=%{http_code} redirects=%{num_redirects}' -A "$UA" -c cookies.txt -b cookies.txt -H "Origin: $BASE" -H "Content-Type: application/x-www-form-urlencoded" --data 'password=thanhnhan' "$BASE/auth/login" || true)
          echo "login -> $LOGIN_RESULT"
          echo "$LOGIN_RESULT" | grep -q 'code=200' || exit 1
          echo "$LOGIN_RESULT" | grep -q 'redirects=0' || exit 1
          grep -q 'scheduleAll' logged-in.html || exit 1

          ME_CODE=$(curl -sS -o me.json -w '%{http_code}' -b cookies.txt "$BASE/api/me")
          echo "api_me=$ME_CODE"
          test "$ME_CODE" = "200" || { cat me.json; exit 1; }
          node -e 'const x=require("./me.json");if(x.role!=="partner"||x.actor!=="Thanh Nhàn")process.exit(1)'

          SCHEDULE_CODE=$(curl -sS -o schedule.json -w '%{http_code}' -b cookies.txt "$BASE/api/schedule")
          echo "api_schedule=$SCHEDULE_CODE"
          test "$SCHEDULE_CODE" = "200" || { cat schedule.json; exit 1; }

          LOGOUT_RESULT=$(curl -sS --connect-timeout 10 --max-time 20 -o logged-out.html -w 'code=%{http_code} redirects=%{num_redirects}' -A "$UA" -c cookies.txt -b cookies.txt -X POST -H "Origin: $BASE" "$BASE/auth/logout" || true)
          echo "logout -> $LOGOUT_RESULT"
          echo "$LOGOUT_RESULT" | grep -q 'code=200' || exit 1
          echo "$LOGOUT_RESULT" | grep -q 'redirects=0' || exit 1
          grep -q 'Vào Fishing Ops' logged-out.html || exit 1

          PAGEDEV=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w 'code=%{http_code} redirects=%{num_redirects}' -A "$UA" "https://$PAGES_TARGET/app" || true)
          echo "pages.dev/app -> $PAGEDEV"
          echo "$PAGEDEV" | grep -q 'code=200' || exit 1
          echo "$PAGEDEV" | grep -q 'redirects=0' || exit 1
