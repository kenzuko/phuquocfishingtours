name: Deploy Fishing Ops Portal

on:
  push:
    branches: [main]
    paths:
      - "fishing-worker.js"
      - "fishing-public/**"
      - "db/migrations/**"
      - ".github/workflows/deploy-fishing-portal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-phuquocfishingtours-fishing-portal
  cancel-in-progress: false

permissions:
  contents: read

env:
  WORKER_NAME: phuquocfishingtours-fishing-ops
  DB_NAME: phuquocfishingtours-booking
  ROUTE_PATTERN: phuquocfishingtours.com/fishing*
  ZONE_NAME: phuquocfishingtours.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify existing desk
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --check fishing-worker.js
          node --check fishing-public/fishing/app.js

      - name: Validate required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ADMIN_USER" || { echo "::error::Missing FISHING_DESK_ADMIN_USER"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::Missing FISHING_DESK_ADMIN_PASSWORD"; exit 1; }
          test -n "$SESSION_SECRET" || { echo "::error::Missing FISHING_DESK_SESSION_SECRET"; exit 1; }

      - name: Locate D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.143.0 d1 list --json > d1.json
          DB_ID=$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("d1.json","utf8")); const x=rows.find(r=>r.name===process.env.DB_NAME); if(x) process.stdout.write(x.uuid||x.id||"");')
          test -n "$DB_ID" || { echo "::error::D1 database not found"; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build Worker configs
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs=require("fs");
          const base={
            "$schema":"node_modules/wrangler/config-schema.json",
            name:process.env.WORKER_NAME,
            main:"./fishing-worker.js",
            compatibility_date:"2026-10-01",
            workers_dev:true,
            preview_urls:false,
            assets:{directory:"./fishing-public",binding:"ASSETS",run_worker_first:true},
            d1_databases:[{
              binding:"BOOKING_DB",
              database_name:process.env.DB_NAME,
              database_id:process.env.DB_ID,
              migrations_dir:"db/migrations"
            }]
          };
          fs.writeFileSync("wrangler.fishing.bootstrap.json",JSON.stringify(base,null,2));
          fs.writeFileSync("wrangler.fishing.json",JSON.stringify({
            ...base,
            routes:[{pattern:process.env.ROUTE_PATTERN,zone_name:process.env.ZONE_NAME}]
          },null,2));
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 d1 migrations apply BOOKING_DB --remote --config wrangler.fishing.bootstrap.json

      - name: Bootstrap Worker without production route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 deploy --config wrangler.fishing.bootstrap.json

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.FISHING_DESK_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.FISHING_DESK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.FISHING_DESK_SESSION_SECRET }}
        run: |
          printf '%s' "$ADMIN_USER" | npx --yes wrangler@4.143.0 secret put ADMIN_USER --config wrangler.fishing.bootstrap.json
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.143.0 secret put ADMIN_PASSWORD --config wrangler.fishing.bootstrap.json
          printf '%s' "$SESSION_SECRET" | npx --yes wrangler@4.143.0 secret put SESSION_SECRET --config wrangler.fishing.bootstrap.json

      - name: Deploy production path route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 deploy --config wrangler.fishing.json

      - name: Verify route is protected
        run: |
          CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o fishing.html -w "%{http_code}" "https://phuquocfishingtours.com/fishing" || true)
          echo "fishing_http=$CODE"
          test "$CODE" = "200" || { cat fishing.html || true; exit 1; }
          grep -Eq "Fishing Ops|Kích hoạt Fishing Ops" fishing.html || { cat fishing.html; exit 1; }
          {
            echo "### Fishing Ops Portal"
            echo ""
            echo "- URL: https://phuquocfishingtours.com/fishing"
            echo "- HTTP: $CODE"
            echo "- Data: shared D1 $DB_NAME"
            echo "- Search indexing: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
